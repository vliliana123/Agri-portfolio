# =============================================================================
# Render Blueprint — deploy „one-click" din GitHub.
#
# Baza de date: PostgreSQL pe Neon (gratuit, fără expirare).
# DATABASE_URL se setează MANUAL în dashboard-ul Render (Environment) cu șirul
# de conexiune copiat din Neon — de aceea e `sync: false` mai jos.
# =============================================================================

services:
  - type: web
    name: agri-portfolio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true            # redeploy automat la push pe GitHub
    envVars:
      - key: SECRET_KEY
        generateValue: true     # Render generează o cheie sigură, unică
      - key: DEBUG
        value: "False"
      - key: SEED_DEMO
        value: "false"          # pune "true" O DATĂ ca să populezi baza Neon nouă,
                                # apoi revino la "false" (altfel reseedează la fiecare deploy)
      - key: DATABASE_URL
        sync: false             # setat manual în dashboard = șirul de conexiune Neon
